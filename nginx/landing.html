<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PgBunker</title>
  <style>
    body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:#0f1419;
           color:#e6e6e6; display:flex; min-height:100vh; align-items:center; justify-content:center; }
    .wrap { text-align:center; padding:24px; }
    h1 { font-weight:600; letter-spacing:1px; margin:0 0 4px; }
    p { color:#8a94a6; margin:0 0 32px; }
    .panels { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
    a.card { display:block; padding:20px 32px; min-width:140px; background:#1a2129;
             border:1px solid #2a333f; border-radius:10px; color:#e6e6e6;
             text-decoration:none; transition:border-color .15s, background .15s; }
    a.card:hover { background:#222b35; border-color:#3d8bff; }
    a.card span { display:block; font-size:18px; font-weight:600; }
    a.card small { color:#8a94a6; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>PgBunker</h1>
    <p>Self-hosted Postgres stack</p>
    <div class="panels">
      <a class="card" href="/grafana"><span>Grafana</span><small>Dashboards</small></a>
      <a class="card" href="/pghero"><span>PgHero</span><small>Query insights</small></a>
      <a class="card" href="/dozzle"><span>Dozzle</span><small>Live logs</small></a>
    </div>
  </div>
</body>
</html>
