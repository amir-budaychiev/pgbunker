services:
  postgres:
    image: postgres:17.9
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "max_connections=${PG_MAX_CONNECTIONS}"
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS}"
      - "-c"
      - "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE}"
      - "-c"
      - "work_mem=${PG_WORK_MEM}"
      - "-c"
      - "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM}"
      - "-c"
      - "log_min_duration_statement=${PG_LOG_MIN_DURATION_STATEMENT}"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_temp_files=0"
      - "-c"
      - "password_encryption=scram-sha-256"
      - "-c"
      - "autovacuum_max_workers=${PG_AUTOVACUUM_MAX_WORKERS}"
      - "-c"
      - "autovacuum_naptime=${PG_AUTOVACUUM_NAPTIME}"
      - "-c"
      - "statement_timeout=${PG_STATEMENT_TIMEOUT}"
      - "-c"
      - "idle_in_transaction_session_timeout=${PG_IDLE_IN_TX_TIMEOUT}"
      - "-c"
      - "random_page_cost=${PG_RANDOM_PAGE_COST}"
      - "-c"
      - "effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - db_net
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM_LIMIT}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
     - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
     - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
     - ./pgbouncer/certs:/certs:ro
    tmpfs:
     - /var/run/pgbouncer:uid=70,gid=70,mode=0755
    ports:
     - "127.0.0.1:${PGBOUNCER_UPSTREAM_PORT:-16432}:6432"
    networks:
     - db_net
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} psql -h localhost -p 6432 -U ${POSTGRES_USER} -d pgbouncer -c 'SHOW VERSION' -q --no-align -t 2>/dev/null | grep -qi pgbouncer"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${PGBOUNCER_MEM_LIMIT}
    logging:
     driver: "json-file"
     options:
       max-size: "50m"
       max-file: "7"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    command:
      - "--config.file=/etc/postgres_exporter.yml"
      - "--collector.long_running_transactions"
    volumes:
      - ./prometheus/postgres_exporter.yml:/etc/postgres_exporter.yml:ro
    networks:
      - db_net
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_EXPORTER_MEM_LIMIT}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"

  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:v0.10.2
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
    networks:
      - db_net
    command:
      - "--web.listen-address=:9127"
      # PGBOUNCER_EXPORTER_SSLMODE is auto-derived from PGBOUNCER_TLS by scripts/setup.sh
      - "--pgBouncer.connectionString=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/pgbouncer?sslmode=${PGBOUNCER_EXPORTER_SSLMODE}"
    deploy:
      resources:
        limits:
          memory: ${PGBOUNCER_EXPORTER_MEM_LIMIT}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:${NODE_EXPORTER_HOST_MOUNT_OPTIONS:-ro,rslave}
      - ./prometheus/textfile:/var/lib/node-textfile:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--path.udev.data=/tmp'
      - '--collector.textfile.directory=/var/lib/node-textfile'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+|run/docker/netns/.+)($$|/)'
    networks:
      - db_net
    deploy:
      resources:
        limits:
          memory: ${NODE_EXPORTER_MEM_LIMIT}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    depends_on:
      postgres-exporter:
        condition: service_started
      pgbouncer-exporter:
        condition: service_started
      node-exporter:
        condition: service_started
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROM_RETENTION_TIME}'
      - '--storage.tsdb.retention.size=${PROM_RETENTION_SIZE}'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - db_net
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEM_LIMIT}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"

  grafana:
    image: grafana/grafana:12.3.5
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}/
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - db_net
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEM_LIMIT}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"

  pghero:
    image: ankane/pghero:v3.7.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      PGHERO_USERNAME: ${PGHERO_USERNAME}
      PGHERO_PASSWORD: ${PGHERO_PASSWORD}
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:8080:8080"
    networks:
      - db_net
    deploy:
      resources:
        limits:
          memory: ${PGHERO_MEM_LIMIT}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"

  dozzle:
    image: amir20/dozzle:v10.1.1
    restart: unless-stopped
    environment:
      DOZZLE_AUTH_PROVIDER: simple
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle/users.yml:/data/users.yml:ro
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:8888:8080"
    deploy:
      resources:
        limits:
          memory: ${DOZZLE_MEM_LIMIT}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"

  backup:
    image: ardakilic/postgres-backup-s3:17
    profiles:
      - backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-preflight.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
    volumes:
      - ./scripts/backup-preflight.sh:/usr/local/bin/backup-preflight.sh:ro
      - ./scripts/backup.sh:/backup.sh:ro
      - ./prometheus/textfile:/var/lib/node-textfile
    networks:
      - db_net
    deploy:
      resources:
        limits:
          memory: ${BACKUP_MEM_LIMIT}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"

networks:
  db_net:
    driver: bridge

volumes:
  pg_data:
  prometheus_data:
  grafana_data:
