services:
  postgres:
    image: postgres:17.9
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "max_connections=${PG_MAX_CONNECTIONS}"
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS}"
      - "-c"
      - "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE}"
      - "-c"
      - "work_mem=${PG_WORK_MEM}"
      - "-c"
      - "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM}"
      - "-c"
      - "log_min_duration_statement=${PG_LOG_MIN_DURATION_STATEMENT}"
      - "-c"
      - "password_encryption=scram-sha-256"
      - "-c"
      - "autovacuum_max_workers=${PG_AUTOVACUUM_MAX_WORKERS}"
      - "-c"
      - "autovacuum_naptime=${PG_AUTOVACUUM_NAPTIME}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - db_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
     - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
     - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
     - "${PGBOUNCER_LISTEN_PORT}:6432"
    networks:
     - db_net
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} psql -h localhost -p 6432 -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1' -q --no-align -t 2>/dev/null | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
     driver: "json-file"
     options:
       max-size: "50m"
       max-file: "7"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    command:
      - "--config.file=/etc/postgres_exporter.yml"
    volumes:
      - ./prometheus/postgres_exporter.yml:/etc/postgres_exporter.yml:ro
    networks:
      - db_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"

  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:v0.10.2
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
    networks:
      - db_net
    command:
      - "--web.listen-address=:9127"
      - "--pgBouncer.connectionString=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/pgbouncer?sslmode=disable"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    volumes:
      - /:/host:${NODE_EXPORTER_HOST_MOUNT_OPTIONS:-ro,rslave}
    command:
      - '--path.rootfs=/host'
    networks:
      - db_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    depends_on:
      postgres-exporter:
        condition: service_started
      pgbouncer-exporter:
        condition: service_started
      node-exporter:
        condition: service_started
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROM_RETENTION_TIME}'
      - '--storage.tsdb.retention.size=${PROM_RETENTION_SIZE}'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - db_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"

  grafana:
    image: grafana/grafana:12.3.5
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - db_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"

  pghero:
    image: ankane/pghero:v3.7.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      PGHERO_USERNAME: ${PGHERO_USERNAME}
      PGHERO_PASSWORD: ${PGHERO_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - db_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"

  dozzle:
    image: amir20/dozzle:v10.1.1
    restart: unless-stopped
    environment:
      DOZZLE_AUTH_PROVIDER: simple
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle/users.yml:/data/users.yml:ro
    ports:
      - "8888:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"

  backup:
    image: ardakilic/postgres-backup-s3:17
    profiles:
      - backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-preflight.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
    volumes:
      - ./scripts/backup-preflight.sh:/usr/local/bin/backup-preflight.sh:ro
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - db_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"

networks:
  db_net:
    driver: bridge

volumes:
  pg_data:
  prometheus_data:
  grafana_data:
